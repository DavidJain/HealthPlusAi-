[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#04030A"
secondaryBackgroundColor = "#14122A"
textColor = "#EEECF8"
borderColor = "#2A2745"
font = "sans serif"
baseRadius = "12px"

[theme.sidebar]
backgroundColor = "#080714"
secondaryBackgroundColor = "#15132B"
textColor = "#EEECF8"
primaryColor = "#A06BFF"
borderColor = "#24213D"

[client]
toolbarMode = "minimal"

[server]
headless = true
# The watcher re-scans every imported module for code changes. With
# transformers loaded it walks hundreds of optional submodules and logs a
# "No module named 'torchvision'" traceback for each; it also costs CPU.
# Restart the app after editing code instead.
fileWatcherType = "none"
